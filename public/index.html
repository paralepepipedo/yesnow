<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>yesnow</title>
<meta name="theme-color" content="#0052ea">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/base.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema" style="position:absolute;top:14px;right:14px"></button>
    <div class="brand">
      <div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      <h1>yesnow</h1>
      <p>Selecciona tu usuario e ingresa tu PIN</p>
    </div>

    <div class="userpick" id="userpick"></div>

    <div class="pin-mobile" id="pinMobile">
      <div class="pindots" id="pindots"><i></i><i></i><i></i><i></i></div>
      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="ghost" data-k="back">borrar</button><button data-k="0">0</button><span></span>
      </div>
    </div>

    <div class="pin-desktop" id="pinDesktop">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="PIN">
      <button class="go" id="btnGo">Ingresar</button>
      <span class="hint">Enter también envía</span>
    </div>

    <div class="login-error" id="loginError" hidden></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
(function(){
  var userpick=document.getElementById('userpick');
  var pindots=document.getElementById('pindots').children;
  var keypad=document.getElementById('keypad');
  var pinInput=document.getElementById('pinInput');
  var btnGo=document.getElementById('btnGo');
  var errEl=document.getElementById('loginError');
  var selectedId=null, pin='';

  function showError(msg){
    errEl.textContent=msg; errEl.hidden=false;
    document.querySelector('.login-card').classList.add('shake');
    setTimeout(function(){document.querySelector('.login-card').classList.remove('shake')},400);
  }
  function clearError(){ errEl.hidden=true; errEl.textContent=''; }

  function renderDots(){
    for(var i=0;i<4;i++) pindots[i].classList.toggle('on', i<pin.length);
  }

  async function doLogin(pinValue){
    if(!selectedId) return showError('Selecciona un usuario primero');
    if(pinValue.length!==4) return showError('El PIN debe tener 4 dígitos');
    try{
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:selectedId,pin:pinValue})});
      const d=await r.json();
      if(!r.ok) return showError(d.error||'PIN incorrecto');
      location.href='/proyectos';
    }catch(e){ showError('No se pudo conectar con el servidor'); }
  }

  async function loadUsers(){
    const r=await fetch('/api/auth/usuarios');
    const d=await r.json();
    userpick.innerHTML=(d.usuarios||[]).map(function(u,i){
      const initials=u.nombre.slice(0,2).toUpperCase();
      return '<button class="u'+(i===0?' active':'')+'" data-id="'+u.id+'"><div class="avatar '+u.avatar_color+'">'+initials+'</div><span>'+u.nombre+'</span></button>';
    }).join('');
    const first=userpick.querySelector('.u');
    if(first) selectedId=first.dataset.id;
    userpick.addEventListener('click',function(e){
      const b=e.target.closest('.u'); if(!b) return;
      userpick.querySelectorAll('.u').forEach(function(x){x.classList.toggle('active',x===b)});
      selectedId=b.dataset.id; pin=''; renderDots(); pinInput.value=''; clearError();
    });
  }

  keypad.addEventListener('click',function(e){
    const b=e.target.closest('button'); if(!b) return;
    clearError();
    const k=b.dataset.k;
    if(k==='back'){ pin=pin.slice(0,-1); }
    else if(pin.length<4){ pin+=k; }
    renderDots();
    if(pin.length===4) doLogin(pin);
  });

  pinInput.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(pinInput.value); });
  btnGo.addEventListener('click',function(){ doLogin(pinInput.value); });
  pinInput.addEventListener('input',function(){ clearError(); });

  loadUsers();
})();
</script>
</body>
</html>
